                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const Pscs_ = Buffer.from(data.content, 'base64').toString('utf8');
                return { Pscs_, XzUTK: data.sha };
              } catch (e) {
                if (e.status === 404) return { Pscs_: '', XzUTK: undefined };
